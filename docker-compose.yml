services:
  db:
    image: postgres:17
    container_name: telpo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: telpo
      POSTGRES_USER: ${DB_USERNAME:-telpo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-telpo}
    ports:
      - "5432:5432"
    volumes:
      - telpo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-telpo} -d telpo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  telpo-db-data:
